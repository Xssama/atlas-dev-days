<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Atlas Dev Days</title>
    <meta name="description" content="Découvrez le programme des Atlas Dev Days : talks et ateliers sur deux journées.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
        <nav>
        <a href = "index.html"><img src="./assets/icons/logo.svg" alt="atlas dev logo"></a>
        <ul>
           <li><a href="./programme.html">Programme</a></li>
            <li><a href="./intervenants.html">Intervenants</a></li>
            <li><a href="./inscription.html">S'inscrire</a></li>
        </ul>
        </nav>
    </header>
    <main>
        <section id="inscription-hero">
            <h1>Inscription</h1>
        </section>
        <section id="inscription-formulaire">
            <h2>Inscrivez-vous</h2>
                <form>
                    <div class="form-group">
                        <label for="nom">Nom Complet:</label>
                        <input type="text" id="nom" name="nom" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="tel">Telephone:</label>
                        <input type="tel" id="tel" name="Telephone" required pattern="^(\+212|0)[5-7][0-9]{8}$">
                    </div>
                    <div class="form-group">
                        <label for="profile">Profil</label>
                        <select id="profile" name="profile" required>
                            <option value="">Choisir un profil</option>
                            <option value="etudiant">Etudiant</option>
                            <option value="developer">Développeur</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <fieldset class="form-group">
                        <legend>Ateliers souhaités</legend>
                        <label>
                            <input type="checkbox" name="workshops" value="html-css"> HTML & CSS Avancé
                        </label>
                        <label>
                            <input type="checkbox" name="workshops" value="docker"> Docker
                        </label>
                        <label>
                            <input type="checkbox" name="workshops" value="github"> Git & GitHub
                        </label>
                        <label>
                            <input type="checkbox" name="workshops" value="accessibilité"> Accessibilité Web
                        </label>
                        <label>
                            <input type="checkbox" name="workshops" value="performance"> Performance Web
                        </label>
                    </fieldset>
                    <fieldset class="form-group">
                        <legend>Journée(s) de participation</legend>
                        <label>
                            <input type="radio" name="day" value="jour1" required>Jour 1
                        </label>
                        <label>
                            <input type="radio" name="day" value="jour2">Jour2
                        </label>
                        <label>
                            <input type="radio" name="day" value="both">Les Deux
                        </label>
                    </fieldset>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea name="message" id="message" rows="5"></textarea>
                    </div>
                    <div class="form-group">
                    <label>
                    <input type="checkbox" id="consentement" name="consentement" required> J'accepte que mes données soient utilisées dans le cadre de mon inscription à l'événement.
                    </label>
                    </div>
                    <div class="form-group">
                        <button type="submit">S'inscrire</button>
                    </div>
                </form>
            </section>  
    </main>
     <footer>
        <h2>Atlas Dev Days</h2>
        <div class="footer-social">
            <h3>Social</h3>
            <a href="#">LinkedIn</a>
            <a href="#">Facebook</a>
            <a href="#">X</a>
        </div>
        <div class="footer-contact">
            <h3>contact</h3>
            <a href="mailto:contact@atlasdev.ma">contact@atlasDev.ma</a>
            
        </div>
        <div class="footer-info">
            <h3>Informations</h3>
            <a href="#">Mentions légales</a>
        </div>
    </footer>
</body>
</html>
